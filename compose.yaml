services:
  api:
    build: .
    ports:
      - "127.0.0.1:8004:8000"
    volumes:
      - wine-history:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  wine-history:
